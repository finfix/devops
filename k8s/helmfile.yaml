environments:
  dev:
    secrets:
      - "config/secrets-dev.yaml"
  prod:
    secrets:
      - "config/secrets-prod.yaml"

---

repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: jetstack
    url: https://charts.jetstack.io
  - name: incubator
    url: https://charts.helm.sh/incubator
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

helmDefaults:
  kubeContext: coin

templates:
  default:
    namespace: "{{ .Release.Name }}-{{ .Environment.Name }}"
    createNamespace: true
    missingFileHandler: Warn
    values:
      - "config/{{ .Release.Name }}/values.yaml.gotmpl"
      - "config/{{ .Release.Name }}/values-{{ .Environment.Name }}.yaml.gotmpl"

releases:
  # Nginx Ingress
  - name: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    namespace: ingress-nginx
    inherit:
      - template: default

  # Cert-manager
  - name: cert-manager
    chart: jetstack/cert-manager
    namespace: cert-manager
    inherit:
      - template: default
  - name: letsencrypt-issuer
    chart: incubator/raw
    namespace: cert-manager
    version: 0.2.5
    needs: [cert-manager]
    inherit:
      - template: default

  # Monitoring
  - name: monitoring
    chart: prometheus-community/kube-prometheus-stack
    namespace: monitoring
    disableValidationOnInstall: true
    inherit:
      - template: default

  # Postgresql
  - name: postgres
    chart: bitnami/postgresql
    version: 18.3.0
    inherit:
      - template: default

  # Coin Server
  - name: coin-server
    chart: ./coin-server
    namespace: coin-{{ .Environment.Name }}
    missingFileHandler: Warn
    values:
      - "config/{{ .Release.Name }}/values.yaml.gotmpl"
      - "config/{{ .Release.Name }}/values-{{ .Environment.Name }}.yaml.gotmpl"
      - "../../{{ .Release.Name }}/deploy/values.local.yaml"
