# Что развёрнуто в кластере coin. Шаблоны и базовая настройка — common/k8s/platform.yaml,
# настройка подключается по имени релиза (см. там). Без version — последняя версия чарта.
bases:
  - ../common/k8s/platform.yaml

---

environments:
  dev:
    values:
      # Адреса сервисов наблюдаемости (переопределяются в cluster.yaml)
      - ../common/k8s/platform/endpoints.yaml
      - cluster.yaml
    secrets:
      - "secrets/secrets-dev.yaml"
  prod:
    values:
      # Адреса сервисов наблюдаемости (переопределяются в cluster.yaml)
      - ../common/k8s/platform/endpoints.yaml
      - cluster.yaml
    secrets:
      - "secrets/secrets-prod.yaml"

---

helmDefaults:
  kubeContext: coin

releases:

  # ---------- Платформа ----------

  - name: cluster-users
    chart: incubator/raw
    namespace: default
    inherit: [{template: platform}]

  # Отличие coin — ssl-passthrough (config/ingress-nginx)
  - name: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    inherit: [{template: platform}]

  - name: cert-manager
    chart: jetstack/cert-manager
    inherit: [{template: platform}]

  - name: letsencrypt-issuer
    chart: incubator/raw
    namespace: cert-manager
    disableValidationOnInstall: true
    needs: [cert-manager/cert-manager]
    inherit: [{template: platform}]

  # Registry Credentials — секрет для pull образов в namespace окружения
  - name: registry-credentials
    chart: incubator/raw
    namespace: "{{ .Environment.Name }}"
    inherit: [{template: prod_dev}]

  - name: loki
    chart: grafana/loki
    inherit: [{template: platform}]

  - name: promtail
    chart: grafana/promtail
    needs: [loki/loki]
    inherit: [{template: platform}]

  # Сбор логов (пока параллельно с Promtail, метка collector="alloy"), OTLP и pprof
  - name: alloy
    chart: grafana/alloy
    needs: [loki/loki]
    inherit: [{template: platform}]

  # Трейсы (features.tracing в cluster.yaml)
  - name: tempo
    chart: grafana-community/tempo
    inherit: [{template: platform}]

  # Профили (features.profiling в cluster.yaml)
  - name: pyroscope
    chart: grafana/pyroscope
    inherit: [{template: platform}]

  # Prometheus, Alertmanager, Grafana. Grafana хранит состояние в postgres-<env>,
  # БД и пользователя создаёт postgres-init — до него Grafana не стартует
  - name: monitoring
    chart: prometheus-community/kube-prometheus-stack
    disableValidationOnInstall: true
    needs: ["postgres-{{ .Environment.Name }}/postgres-init"]
    inherit: [{template: platform}]

  - name: prometheus-blackbox
    chart: prometheus-community/prometheus-blackbox-exporter
    namespace: monitoring
    needs: [monitoring/monitoring]
    inherit: [{template: platform}]

  - name: grafana-dashboards
    chart: incubator/raw
    namespace: monitoring
    needs: [monitoring/monitoring]
    inherit: [{template: platform}]

  # Мажорные версии Postgres требуют миграции данных — версия закреплена
  - name: postgres
    chart: bitnami/postgresql
    version: 18.3.0
    inherit: [{template: prod_dev}]

  - name: postgres-init
    chart: incubator/raw
    namespace: "postgres-{{ .Environment.Name }}"
    needs: ["postgres-{{ .Environment.Name }}/postgres"]
    inherit: [{template: prod_dev}]

  # ---------- Сервисы ----------

  - name: coin-server
    chart: ../common/k8s/charts/app
    needs:
      - "postgres-{{ .Environment.Name }}/postgres-init"
      - "{{ .Environment.Name }}/registry-credentials"
    inherit: [{template: chart}]

  # Tasks server (jedi-tasks)
  - name: tasks-server
    chart: ../common/k8s/charts/app
    needs:
      - "postgres-{{ .Environment.Name }}/postgres-init"
      - "{{ .Environment.Name }}/registry-credentials"
    inherit: [{template: chart}]

  # ---------- Проброс на rpi (TCP без расшифровки, сертификаты на rpi) ----------

  - name: vault-proxy
    chart: incubator/raw
    inherit: [{template: platform}]

  - name: obsi-mcp-proxy
    chart: incubator/raw
    inherit: [{template: platform}]

  - name: homeassistant-proxy
    chart: incubator/raw
    namespace: homeassistant
    inherit: [{template: platform}]
