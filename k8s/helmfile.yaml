# Общие компоненты (версии, базовая настройка) — common/k8s/platform.yaml.
# Здесь — что развёрнуто в кластере coin и сервисы проекта.
bases:
  - ../common/k8s/platform.yaml

---

environments:
  dev:
    values:
      - cluster.yaml
    secrets:
      - "secrets/secrets-dev.yaml"
  prod:
    values:
      - cluster.yaml
    secrets:
      - "secrets/secrets-prod.yaml"

---

helmDefaults:
  kubeContext: coin

releases:
  # Cluster Users
  - name: cluster-users
    inherit:
      - template: cluster-users

  # Nginx Ingress
  - name: ingress-nginx
    inherit:
      - template: ingress-nginx

  # Cert-manager
  - name: cert-manager
    inherit:
      - template: cert-manager

  - name: letsencrypt-issuer
    inherit:
      - template: letsencrypt-issuer

  # Loki
  - name: loki
    inherit:
      - template: loki

  # Promtail
  - name: promtail
    inherit:
      - template: promtail

  # Monitoring
  - name: monitoring
    inherit:
      - template: monitoring

  - name: prometheus-blackbox
    inherit:
      - template: prometheus-blackbox

  - name: grafana-dashboards
    inherit:
      - template: grafana-dashboards

  # Postgresql
  - name: postgres
    inherit:
      - template: postgres

  - name: postgres-init
    inherit:
      - template: postgres-init

  # Registry Credentials
  - name: registry-credentials
    inherit:
      - template: registry-credentials

  # Server
  - name: coin-server
    chart: ../common/k8s/charts/app
    inherit:
      - template: chart
    needs:
      - "postgres-{{ .Environment.Name }}/postgres-init"
      - "{{ .Environment.Name }}/registry-credentials"

  # Tasks server (jedi-tasks)
  - name: tasks-server
    chart: ../common/k8s/charts/app
    inherit:
      - template: chart
    needs:
      - "postgres-{{ .Environment.Name }}/postgres-init"
      - "{{ .Environment.Name }}/registry-credentials"

  # For RPI: Vault живёт на rpi, TCP без расшифровки
  - name: vault-proxy
    chart: incubator/raw
    version: 0.2.5
    inherit:
      - template: singleton

  # For RPI: TCP без расшифровки, сертификат на rpi
  - name: obsi-mcp-proxy
    chart: incubator/raw
    version: 0.2.5
    inherit:
      - template: singleton

  # For RPI
  - name: homeassistant-proxy
    chart: incubator/raw
    version: 0.2.5
    namespace: homeassistant
    inherit:
      - template: singleton
