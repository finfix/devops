---
- name: Initial server setup as root
  hosts: coin-1
  become: yes
  vars:
    ansible_user: root
    ansible_port: 22

  roles:
    - role: users
    - role: ssh_hardening
    - role: hostname
    - role: fail2ban
    - role: unattended_upgrades
    - role: wireguard
    - role: firewall
    - role: reboot
