hostname: raspberry-pi

# Два независимых WG-интерфейса под разные цели (глава 8.4 wireguard.md —
# отдельный проект, отдельная подсеть, даже если это одна и та же машина):
#
# wg0        — RPi как КЛИЕНТ к coin-1. Узкоцелевой туннель: единственная
#              задача — дать coin-1 (у которого есть публичный IP) проксировать
#              домен HA наружу, т.к. у RPi своего публичного IP нет (дом за NAT).
#              Endpoint/persistent_keepalive обязательны — RPi инициирует сам.
#
# wg-admin   — RPi как СЕРВЕР (хаб) для личного админ-доступа с Мака.
#              Не пересекается с wg0 ни по подсети, ни по ключам: утечка
#              одного туннеля не даёт доступа ко второму.
wireguard:
  - interface: wg0
    address: ["10.10.10.2/24"]
    peers:
      - name: coin-1
        public_key: "<публичный ключ wg0 на coin-1>"
        allowed_ips: ["10.10.10.1/32"]
        endpoint: "coin-1.bonavii.com:51820"
        persistent_keepalive: 25

  - interface: wg-admin
    address: ["10.20.20.1/24"]
    listen_port: 51821
    peers:
      - name: macbook-bonavi
        public_key: "<публичный ключ Мака для ЭТОЙ сети — сгенерировать новый, не переиспользовать ключ от wg0/coin-1>"
        allowed_ips: ["10.20.20.2/32"]

# Периметр RPi — по аналогии с coin-1 (iptables.md, ansible/host_vars/coin-1/env.yml):
# SSH и всё "управляющее" — только через wg-admin, не с eth0/LAN.
#
# wg0 не требует своего inbound-правила: RPi в нём клиент, сам исходящий
# порт не фиксирован (нет listen_port), слушать входящие 51820 незачем —
# это порт ХАБА (coin-1), не RPi.
firewall_allowed_ports:
  - { port: 51821, protocol: udp }                      # wg-admin handshake — вход с Мака (RPi тут сервер)
  - { port: 2002, protocol: tcp, interface: wg-admin }  # SSH — только через личный админ-туннель
