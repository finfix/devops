hostname: coin-1

# Периметр coin-1: HTTP(S) от ingress-nginx — публично.
# SSH и kube-apiserver — только через WireGuard (wg0), не с eth0.
# Остальное (kubelet, node_exporter и т.п.) наружу не открыто —
# см. iptables.md в корне репозитория и wireguard.md в Obsidian.
firewall_allowed_ports:
  - { port: 51820, protocol: udp }                 # сам WireGuard handshake — публично
  - { port: 80, protocol: tcp }                    # http – Доступен извне
  - { port: 443, protocol: tcp }                   # https – Доступен извне
  - { port: 2002, protocol: tcp, interface: wg0 }  # SSH — только через VPN
  - { port: 6443, protocol: tcp, interface: wg0 }  # kube-apiserver — только через VPN

wireguard_address: "10.10.10.1/24"
wireguard_listen_port: 51820
wireguard_peers:
  - name: raspberry-pi
    public_key: "PaADdH4oTYmLq1RcfzlMDbl/QAFybMT6OIGqkRqMNAM="
    allowed_ips: ["10.10.10.2/32"]
  - name: macbook
    public_key: "EV6cyiVsaHwyfHBGu3NLBBCOWVvPsHLOijmHbP6HeH4="
    allowed_ips: ["10.10.10.3/32"]
