hostname: coin-1

# Периметр coin-1: HTTP(S) от ingress-nginx — публично.
# SSH и kube-apiserver — только через WireGuard (wg-client-coin), не с eth0.
# Остальное (kubelet, node_exporter и т.п.) наружу не открыто —
# см. iptables.md в корне репозитория и wireguard.md в Obsidian.
firewall_allowed_ports:
  - { port: 51820, protocol: udp }                 # wg-client-coin handshake — публично
  - { port: 51823, protocol: udp }                 # wg-coin-pi handshake — публично
  - { port: 80, protocol: tcp }                    # http – Доступен извне
  - { port: 443, protocol: tcp }                   # https – Доступен извне
  - { port: 2002, protocol: tcp, interface: wg-client-coin }  # SSH — только через VPN
  - { port: 6443, protocol: tcp, interface: wg-client-coin }  # kube-apiserver — только через VPN

# Приватный ключ — не здесь, а в secrets.yml под ansible-vault:
#   wireguard_private_keys:
#     wg-client-coin: "..."
#     wg-coin-pi: "..."
#
# Сети разведены по назначению, каждая даёт доступ ровно к одному узлу:
#   wg-client-coin — устройства и CI → только coin-1 (SSH, kube-apiserver);
#   wg-coin-pi     — coin-1 ↔ pi: публичные прокси coin-1 ходят в сервисы pi,
#                    и через неё же coin-1 пробрасывает UDP 51821 на wg-client-pi
#                    (у pi нет белого IP, телефон и Мак подключаются к pi через coin-1;
#                    шифрование сквозное, coin-1 видит только UDP-пакеты).
wireguard:
  - interface: wg-coin-pi
    address: ["10.40.40.1/24"]
    listen_port: 51823
    post_up:
      - "iptables -t nat -A PREROUTING -i eth0 -p udp --dport 51821 -j DNAT --to-destination 10.40.40.2:51821"
      # Ответ pi должен вернуться через coin-1, а не через домашний NAT
      - "iptables -t nat -A POSTROUTING -o %i -p udp -d 10.40.40.2 --dport 51821 -j MASQUERADE"
      - "iptables -I FORWARD -i eth0 -o %i -p udp -d 10.40.40.2 --dport 51821 -j ACCEPT"
      - "iptables -I FORWARD -i %i -o eth0 -p udp -s 10.40.40.2 --sport 51821 -j ACCEPT"
    post_down:
      - "iptables -t nat -D PREROUTING -i eth0 -p udp --dport 51821 -j DNAT --to-destination 10.40.40.2:51821"
      - "iptables -t nat -D POSTROUTING -o %i -p udp -d 10.40.40.2 --dport 51821 -j MASQUERADE"
      - "iptables -D FORWARD -i eth0 -o %i -p udp -d 10.40.40.2 --dport 51821 -j ACCEPT"
      - "iptables -D FORWARD -i %i -o eth0 -p udp -s 10.40.40.2 --sport 51821 -j ACCEPT"
    peers:
      - name: pi
        public_key: "PaADdH4oTYmLq1RcfzlMDbl/QAFybMT6OIGqkRqMNAM="
        allowed_ips: ["10.40.40.2/32"]

  - interface: wg-client-coin
    address: ["10.10.10.1/24"]
    listen_port: 51820
    peers:
      - name: macbook-bonavi
        public_key: "EV6cyiVsaHwyfHBGu3NLBBCOWVvPsHLOijmHbP6HeH4="
        allowed_ips: ["10.10.10.3/32"]
      - name: iphone-bonavi
        public_key: "KSHkAvJ5wO1Rkw5mSXGa3Nx1qKzGAxddii/BXUzOjh8="
        allowed_ips: ["10.10.10.4/32"]
      - name: pi-backuper
        public_key: "TR1Kz6aaY5TJAz1tjno3DunbfhxdwD419VM8bEn/H0M="
        allowed_ips: ["10.10.10.5/32"]
      # Раннеры GitHub Actions: helmfile-деплой ходит к kube-apiserver через VPN.
      # Конфиг пира с приватным ключом — в Vault, ci/coin/wireguard-ci
      - name: github-ci
        public_key: "dSMqPaVUjikWEC/SK+XW/Te6zGx16j7juHAHu9x1v1U="
        allowed_ips: ["10.10.10.6/32"]
