github_registry: "ghcr.io"
project_dir: "/opt/coin"
compose_project_name: "coin"
main_domain: bonavii.com
domains:
  - name: "rest.{{ main_domain }}"
    port: 8080
    basic_auth: false
    type: site
    ssl_certificate_path: "/etc/letsencrypt/live/{{ main_domain }}/fullchain.pem"
    ssl_key_path: "/etc/letsencrypt/live/{{ main_domain }}/privkey.pem"

  - name: "rest.dev.{{ main_domain }}"
    port: 8081
    basic_auth: false
    type: site
    ssl_certificate_path: "/etc/letsencrypt/live/{{ main_domain }}/fullchain.pem"
    ssl_key_path: "/etc/letsencrypt/live/{{ main_domain }}/privkey.pem"

  - name: "grpc.{{ main_domain }}"
    port: 8090
    basic_auth: false
    type: grpc
    ssl_certificate_path: "/etc/letsencrypt/live/{{ main_domain }}/fullchain.pem"
    ssl_key_path: "/etc/letsencrypt/live/{{ main_domain }}/privkey.pem"

  - name: "grpc.dev.{{ main_domain }}"
    port: 8091
    basic_auth: false
    type: grpc
    ssl_certificate_path: "/etc/letsencrypt/live/{{ main_domain }}/fullchain.pem"
    ssl_key_path: "/etc/letsencrypt/live/{{ main_domain }}/privkey.pem"
