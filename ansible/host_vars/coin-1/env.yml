hostname: coin-1

# Периметр coin-1: SSH (ssh_hardening.ssh_port), HTTP(S) от ingress-nginx.
# Остальное (kube-apiserver, kubelet, node_exporter и т.п.) наружу не открыто —
# см. iptables.md в корне репозитория.
firewall_allowed_ports:
  - { port: 2002, protocol: tcp }
  - { port: 80, protocol: tcp }
  - { port: 443, protocol: tcp }
